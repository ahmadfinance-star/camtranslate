<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>CamTranslate Live</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    overflow: hidden;
}

#app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* HEADER */

header {
    padding:
        calc(env(safe-area-inset-top) + 10px)
        14px
        10px;

    background: #151515;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-size: 17px;
    font-weight: 700;
}

.status {
    font-size: 11px;
    opacity: .75;
}

/* CAMERA */

#camera {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: black;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* OVERLAY */

#overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

/* TRANSLATION */

.translation {
    position: absolute;

    left: 50%;
    top: 48%;

    transform:
        translate(-50%, -100%);

    padding: 6px 12px;

    border: 2px solid #00e676;

    border-radius: 10px;

    background:
        rgba(0,0,0,.78);

    box-shadow:
        0 3px 15px rgba(0,0,0,.7);

    text-align: center;
}

.translation .original {
    font-size: 11px;
    opacity: .65;
}

.translation .result {
    font-size: 22px;
    font-weight: 800;
}

/* SCAN AREA */

.scan {
    position: absolute;

    left: 8%;
    right: 8%;

    top: 38%;

    height: 24%;

    border:
        1px solid
        rgba(255,255,255,.65);

    border-radius: 14px;

    pointer-events: none;
}

.scan-text {
    position: absolute;

    top: -22px;
    left: 0;

    font-size: 11px;

    opacity: .7;
}

/* CONTROLS */

#controls {

    padding:
        9px
        10px
        calc(env(safe-area-inset-bottom) + 9px);

    background: #151515;

    display: flex;

    gap: 7px;
}

button {

    flex: 1;

    padding: 12px 8px;

    border: 0;

    border-radius: 10px;

    font-weight: 700;

    font-size: 13px;
}

button.primary {

    background: white;

    color: black;
}

button.dark {

    background: #333;

    color: white;
}

/* DICTIONARY */

#dictionary {

    display: none;

    position: absolute;

    inset: 0;

    z-index: 20;

    background: #111;

    padding:
        calc(env(safe-area-inset-top) + 15px)
        14px
        calc(env(safe-area-inset-bottom) + 15px);

    overflow: auto;
}

#dictionary h2 {

    margin-top: 0;

}

.input-row {

    display: flex;

    gap: 6px;

}

.input-row input {

    min-width: 0;

    flex: 1;

    background: #222;

    color: white;

    border: 1px solid #555;

    border-radius: 8px;

    padding: 10px;

}

.dictionary-item {

    background: #222;

    margin-top: 7px;

    padding: 11px;

    border-radius: 8px;

    display: flex;

    justify-content: space-between;

    align-items: center;

}

.delete {

    flex: 0 0 auto;

    padding: 7px 10px;

    background: #333;

    color: white;

}

</style>
</head>

<body>

<div id="app">

    <header>

        <div class="title">
            📷 CamTranslate Live
        </div>

        <div
            id="status"
            class="status">
            Ready
        </div>

    </header>


    <div id="camera">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>


        <div id="overlay"></div>


        <div class="scan">

            <div class="scan-text">
                Point camera at text
            </div>

        </div>

    </div>


    <div id="controls">

        <button
            id="startCamera"
            class="primary">

            Start Camera

        </button>


        <button
            id="startOCR"
            class="dark">

            Start OCR

        </button>


        <button
            id="openDictionary"
            class="dark">

            Dictionary

        </button>

    </div>

</div>


<!-- DICTIONARY -->

<div id="dictionary">

    <h2>
        Custom Dictionary
    </h2>


    <div class="input-row">

        <input
            id="sourceText"
            placeholder="aaa1">

        <input
            id="translationText"
            placeholder="apple">

        <button
            id="addButton">

            Add

        </button>

    </div>


    <div id="dictionaryList"></div>


    <button
        id="closeDictionary"
        class="dark"
        style="
        width:100%;
        margin-top:15px;">

        Close

    </button>

</div>


<canvas
    id="canvas"
    style="display:none">
</canvas>


<script>

/* =========================
   ELEMENTS
========================= */

const video =
    document.getElementById("video");

const overlay =
    document.getElementById("overlay");

const status =
    document.getElementById("status");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/* =========================
   VARIABLES
========================= */

let stream = null;

let worker = null;

let OCRRunning = false;

let OCRBusy = false;


/* =========================
   CUSTOM DICTIONARY
========================= */

let dictionary =
    JSON.parse(
        localStorage.getItem(
            "camtranslate_dictionary"
        )
    ) || {

        "aaa1": "APPLE",

        "aaa2": "ORANGE",

        "aaa3": "BANANA"

    };


/* =========================
   SAVE DICTIONARY
========================= */

function saveDictionary() {

    localStorage.setItem(

        "camtranslate_dictionary",

        JSON.stringify(dictionary)

    );

    renderDictionary();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   RENDER DICTIONARY
========================= */

function renderDictionary() {

    const list =
        document.getElementById(
            "dictionaryList"
        );

    list.innerHTML = "";


    Object.entries(dictionary)
        .forEach(([source, translation]) => {

            const item =
                document.createElement("div");

            item.className =
                "dictionary-item";


            item.innerHTML = `

                <span>

                    <b>
                        ${escapeHTML(source)}
                    </b>

                    →

                    ${escapeHTML(translation)}

                </span>

                <button
                    class="delete">

                    Delete

                </button>

            `;


            item.querySelector("button")
                .onclick = () => {

                    delete dictionary[source];

                    saveDictionary();

                };


            list.appendChild(item);

        });

}


/* =========================
   START CAMERA
========================= */

async function startCamera() {

    try {

        if (stream) {

            return;

        }


        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        status.textContent =
            "Camera ON";


    } catch (error) {

        console.error(error);

        status.textContent =
            "Camera blocked";


        alert(
            "Camera permission denied. " +
            "Please allow Camera access " +
            "for this website in Safari."
        );

    }

}


/* =========================
   INITIALIZE OCR
========================= */

async function initializeOCR() {

    if (worker) {

        return;

    }


    status.textContent =
        "Loading OCR...";


    worker =
        await Tesseract.createWorker(
            "eng",
            1
        );


    status.textContent =
        "OCR Ready";

}


/* =========================
   SHOW TRANSLATION
========================= */

function showTranslation(
    original,
    translated
) {

    overlay.innerHTML = "";


    const box =
        document.createElement("div");

    box.className =
        "translation";


    box.innerHTML = `

        <div class="original">

            ${escapeHTML(original)}

        </div>

        <div class="result">

            ${escapeHTML(translated)}

        </div>

    `;


    overlay.appendChild(box);

}


/* =========================
   CLEAR TRANSLATION
========================= */

function clearTranslation() {

    overlay.innerHTML = "";

}


/* =========================
   OCR SCAN
========================= */

async function scanCamera() {

    if (
        !OCRRunning ||
        OCRBusy ||
        !stream
    ) {

        return;

    }


    OCRBusy = true;


    try {

        const width =
            video.videoWidth;

        const height =
            video.videoHeight;


        if (!width || !height) {

            OCRBusy = false;

            return;

        }


        /*
         Reduce image size
         for faster OCR
        */

        const targetWidth = 800;

        const targetHeight =
            Math.round(
                targetWidth *
                height /
                width
            );


        canvas.width =
            targetWidth;

        canvas.height =
            targetHeight;


        ctx.drawImage(

            video,

            0,
            0,

            targetWidth,
            targetHeight

        );


        const result =
            await worker.recognize(
                canvas
            );


        const detectedText =
            (
                result.data.text ||
                ""
            ).trim();


        let found = null;


        /*
         Search dictionary
        */

        for (
            const [source, translation]
            of Object.entries(dictionary)
        ) {

            if (
                detectedText
                    .toLowerCase()
                    .includes(
                        source.toLowerCase()
                    )
            ) {

                found = {

                    source:
                        source,

                    translation:
                        translation

                };

                break;

            }

        }


        if (found) {

            showTranslation(

                found.source,

                found.translation

            );


            status.textContent =
                found.source +
                " → " +
                found.translation;


        } else {

            clearTranslation();


            if (detectedText) {

                status.textContent =
                    "Detected: " +
                    detectedText
                        .substring(0, 30);

            } else {

                status.textContent =
                    "Scanning...";

            }

        }


    } catch (error) {

        console.error(error);

        status.textContent =
            "OCR error";

    }


    OCRBusy = false;


    if (OCRRunning) {

        setTimeout(
            scanCamera,
            800
        );

    }

}


/* =========================
   CAMERA BUTTON
========================= */

document
    .getElementById("startCamera")
    .onclick = startCamera;


/* =========================
   OCR BUTTON
========================= */

document
    .getElementById("startOCR")
    .onclick = async function () {

        if (!stream) {

            await startCamera();

        }


        if (!stream) {

            return;

        }


        if (!OCRRunning) {

            await initializeOCR();


            OCRRunning = true;


            this.textContent =
                "Stop OCR";


            scanCamera();


        } else {

            OCRRunning = false;


            this.textContent =
                "Start OCR";


            clearTranslation();


            status.textContent =
                "Camera ON";

        }

    };


/* =========================
   OPEN DICTIONARY
========================= */

document
    .getElementById("openDictionary")
    .onclick = function () {

        document
            .getElementById("dictionary")
            .style.display =
            "block";


        renderDictionary();

    };


/* =========================
   CLOSE DICTIONARY
========================= */

document
    .getElementById("closeDictionary")
    .onclick = function () {

        document
            .getElementById("dictionary")
            .style.display =
            "none";

    };


/* =========================
   ADD DICTIONARY
========================= */

document
    .getElementById("addButton")
    .onclick = function () {

        const source =
            document
                .getElementById(
                    "sourceText"
                )
                .value
                .trim();


        const translation =
            document
                .getElementById(
                    "translationText"
                )
                .value
                .trim();


        if (
            !source ||
            !translation
        ) {

            return;

        }


        dictionary[source] =
            translation;


        saveDictionary();


        document
            .getElementById(
                "sourceText"
            )
            .value = "";


        document
            .getElementById(
                "translationText"
            )
            .value = "";

    };


/* =========================
   INITIAL DISPLAY
========================= */

renderDictionary();

</script>

</body>
</html>
