<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WBS Lens V5</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:15px 20px;background:#181818;display:flex;justify-content:space-between;gap:12px;align-items:center}
.title{font-size:25px;font-weight:800}.status{font-size:14px;color:#ccc;text-align:right}
.camera{position:relative;height:calc(100vh - 300px);min-height:410px;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}
.scanbox{position:absolute;left:5%;top:30%;width:90%;height:38%;border:2px solid rgba(255,255,255,.8);border-radius:15px}
.hint{position:absolute;left:7%;top:27%;font-size:14px;text-shadow:0 1px 4px #000}
.result{position:absolute;left:5%;right:5%;bottom:14px;padding:13px;border-radius:14px;background:#111d;backdrop-filter:blur(8px)}
.result .wbs{font-size:21px;font-weight:800}.result .desc{font-size:15px;color:#ddd;margin-top:3px}.valid{color:#42e36f}.warn{color:#ffd24a}.bad{color:#ff6565}
.overlay{position:absolute;padding:4px 9px;border-radius:9px;background:#168b45;color:#fff;font-size:21px;font-weight:800;display:none;transform:translate(-50%,-50%);white-space:nowrap}
.controls{padding:15px;display:flex;gap:9px;background:#181818}
button{border:0;border-radius:13px;padding:14px 10px;font-size:16px;font-weight:700;flex:1}
.primary{background:#eee;color:#111}.secondary{background:#333;color:#fff}
button:disabled{opacity:.45}
.panel{padding:14px;background:#1a1a1a}.panel h3{margin:0 0 10px}
input[type=file]{width:100%;padding:10px;background:#222;color:#fff;border-radius:10px}
.small{font-size:13px;color:#aaa;margin-top:8px;line-height:1.4}
table{width:100%;font-size:12px;border-collapse:collapse;margin-top:12px}
td,th{padding:6px;border-bottom:1px solid #333;text-align:left}
</style>
</head>

<body>
<header>
  <div class="title">ð· WBS Lens<br>V5</div>
  <div id="status" class="status">Load WBS Master</div>
</header>

<div class="camera">
  <video id="video" autoplay playsinline muted></video>
  <div class="hint">Point camera at WBS</div>
  <div class="scanbox"></div>
  <div id="overlay" class="overlay"></div>
  <canvas id="canvas" style="display:none"></canvas>
  <div id="result" class="result">
    <div class="wbs">WBS Lens</div>
    <div class="desc">Upload WBS Master, then start camera.</div>
  </div>
</div>

<div class="controls">
  <button id="start" class="primary">Start Camera</button>
  <button id="ocr" class="secondary" disabled>Start OCR</button>
  <button id="master" class="secondary">WBS Master</button>
</div>

<div id="panel" class="panel" style="display:none">
  <h3>WBS Master</h3>
  <input id="file" type="file" accept=".xlsx,.xls,.csv">
  <div class="small">
    Format disyorkan: kolum pertama = WBS, kolum kedua = Description, kolum ketiga = Project (optional).
    Jika belum ada fail, gunakan template CSV di bawah.
  </div>
  <button id="sample" class="secondary" style="margin-top:10px;width:100%">Load Sample WBS</button>
  <div id="count" class="small"></div>
  <div id="preview"></div>
</div>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});
const statusEl=document.getElementById("status");
const overlay=document.getElementById("overlay");
const result=document.getElementById("result");
const startBtn=document.getElementById("start");
const ocrBtn=document.getElementById("ocr");
const panel=document.getElementById("panel");

let stream=null,worker=null,running=false,busy=false;
let master=JSON.parse(localStorage.getItem("wbs_master_v5")||"null")||[];
let lastKey="",lastTime=0;

function clean(s){
  return String(s||"").toUpperCase()
    .replace(/[|]/g,"1")
    .replace(/[âââ]/g,"-")
    .replace(/\s+/g,"")
    .replace(/[^A-Z0-9._/-]/g,"");
}

function normalizeWBS(s){
  return clean(s)
    .replace(/[OQ]/g,"0")
    .replace(/[IL]/g,"1")
    .replace(/[ZS]/g,"2")
    .replace(/[G]/g,"6");
}

function similarity(a,b){
  a=normalizeWBS(a); b=normalizeWBS(b);
  if(!a||!b)return 0;
  if(a===b)return 1;
  const dist=lev(a,b);
  return 1-dist/Math.max(a.length,b.length);
}

function lev(a,b){
  const m=a.length,n=b.length;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    let c=[i];
    for(let j=1;j<=n;j++)
      c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
    p=c;
  }
  return p[n];
}

function extractCandidates(words){
  const out=[];
  for(const w of words){
    const t=clean(w.text);
    if(t.length>=5) out.push({text:t,bbox:w.bbox});
  }
  // Also combine adjacent OCR words. Useful when OCR inserts spaces around separators.
  for(let i=0;i<words.length;i++){
    for(let j=i+1;j<Math.min(i+4,words.length);j++){
      const a=clean(words[i].text), b=clean(words[j].text);
      if(a&&b) out.push({
        text:a+b,
        bbox:{
          x0:Math.min(words[i].bbox.x0,words[j].bbox.x0),
          y0:Math.min(words[i].bbox.y0,words[j].bbox.y0),
          x1:Math.max(words[i].bbox.x1,words[j].bbox.x1),
          y1:Math.max(words[i].bbox.y1,words[j].bbox.y1)
        }
      });
    }
  }
  return out;
}

function findWBS(words){
  if(!master.length)return null;
  const candidates=extractCandidates(words);

  // Exact match first â safest.
  for(const c of candidates){
    const exact=master.find(x=>normalizeWBS(x.wbs)===normalizeWBS(c.text));
    if(exact)return {row:exact,candidate:c,confidence:1,exact:true};
  }

  // Fuzzy matching only when confidence is high and the candidate length is close.
  let best=null;
  for(const c of candidates){
    for(const row of master){
      const target=normalizeWBS(row.wbs);
      const cand=normalizeWBS(c.text);
      if(Math.abs(target.length-cand.length)>2)continue;
      const score=similarity(cand,target);
      if(!best||score>best.confidence)best={row,candidate:c,confidence:score,exact:false};
    }
  }
  return best&&best.confidence>=0.88?best:null;
}

function showResult(hit){
  if(!hit){
    result.innerHTML='<div class="wbs">No WBS match</div><div class="desc">Keep WBS inside the scan box.</div>';
    overlay.style.display="none";
    return;
  }
  const r=hit.row;
  const cls=hit.exact?"valid":"warn";
  result.innerHTML=`<div class="wbs ${cls}">${r.wbs} ${hit.exact?"â":"â  POSSIBLE OCR ERROR"}</div>
    <div class="desc">${r.description||""}${r.project?" â¢ "+r.project:""}</div>
    <div class="small">${hit.exact?"Exact WBS match":"Closest WBS match â verify before posting SAP document"}</div>`;
}

startBtn.onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false
    });
    video.srcObject=stream; await video.play();
    ocrBtn.disabled=false; startBtn.textContent="Camera Ready";
    statusEl.textContent=master.length?`Master: ${master.length} WBS`:"No WBS Master";
  }catch(e){statusEl.textContent="Camera error: "+e.message}
};

ocrBtn.onclick=async()=>{
  if(running){running=false;ocrBtn.textContent="Start OCR";statusEl.textContent="OCR stopped";return;}
  if(!master.length){statusEl.textContent="Upload WBS Master first";return;}
  running=true;ocrBtn.disabled=true;statusEl.textContent="Loading OCRâ¦";
  try{
    worker=await Tesseract.createWorker("eng",1,{logger:m=>{
      if(m.status==="recognizing text")statusEl.textContent="Scanning WBSâ¦";
    }});
    await worker.setParameters({
      tessedit_pageseg_mode:"11",
      preserve_interword_spaces:"1",
      user_defined_dpi:"200"
    });
    ocrBtn.disabled=false;ocrBtn.textContent="Stop OCR";scanLoop();
  }catch(e){running=false;ocrBtn.disabled=false;statusEl.textContent="OCR error"}
};

async function scanLoop(){
  if(!running||busy)return;
  busy=true;
  try{
    const vw=video.videoWidth,vh=video.videoHeight;
    if(vw&&vh){
      const sx=Math.round(vw*.04), sy=Math.round(vh*.24);
      const sw=Math.round(vw*.92), sh=Math.round(vh*.52);
      const scale=Math.min(1.7,1000/sw);
      canvas.width=Math.round(sw*scale);canvas.height=Math.round(sh*scale);
      ctx.filter="contrast(1.28) brightness(1.08)";
      ctx.drawImage(video,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
      ctx.filter="none";

      const ocr=await worker.recognize(canvas);
      const hit=findWBS(ocr.data.words||[]);
      showResult(hit);

      if(hit){
        const b=hit.candidate.bbox;
        const x=(b.x0+b.x1)/2/scale+sx;
        const y=(b.y0+b.y1)/2/scale+sy;
        overlay.textContent=hit.row.wbs;
        overlay.style.left=(x/vw*100)+"%";
        overlay.style.top=(y/vh*100)+"%";
        overlay.style.display="block";
        if(hit.row.wbs!==lastKey||Date.now()-lastTime>1500){
          statusEl.textContent=(hit.exact?"â Valid WBS: ":"â  Check WBS: ")+hit.row.wbs;
          lastKey=hit.row.wbs;lastTime=Date.now();
        }
      }else overlay.style.display="none";
    }
  }catch(e){console.log(e)}
  busy=false;if(running)setTimeout(scanLoop,250);
}

document.getElementById("master").onclick=()=>{
  panel.style.display=panel.style.display==="none"?"block":"none";
  renderMaster();
};

document.getElementById("file").onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  const buf=await file.arrayBuffer();
  let rows=[];
  if(file.name.toLowerCase().endsWith(".csv")){
    const text=new TextDecoder().decode(buf);
    rows=text.split(/\r?\n/).map(x=>x.split(","));
  }else{
    const wb=XLSX.read(buf,{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]];
    rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  }
  importRows(rows);
};

document.getElementById("sample").onclick=()=>{
  master=[
    {wbs:"NCH.01.01.001",description:"Earthwork",project:"NCH Limbang Section 1"},
    {wbs:"NCH.01.01.002",description:"Drainage",project:"NCH Limbang Section 1"},
    {wbs:"NCH.01.02.001",description:"Structure",project:"NCH Limbang Section 1"},
    {wbs:"PBH.02.03.001",description:"Roadwork",project:"Pan Borneo Highway"},
    {wbs:"BL2.03.01.001",description:"Bridge Work",project:"Batang Lupar Bridge No. 2"}
  ];
  localStorage.setItem("wbs_master_v5",JSON.stringify(master));
  renderMaster();
  statusEl.textContent=`Master: ${master.length} WBS`;
};

function importRows(rows){
  if(!rows.length)return;
  let start=0;
  const h=rows[0].map(x=>String(x).toLowerCase());
  if(h.some(x=>x.includes("wbs")))start=1;
  const out=[];
  for(let i=start;i<rows.length;i++){
    const r=rows[i];
    const wbs=String(r[0]||"").trim();
    if(!wbs)continue;
    out.push({wbs,description:String(r[1]||"").trim(),project:String(r[2]||"").trim()});
  }
  master=out;
  localStorage.setItem("wbs_master_v5",JSON.stringify(master));
  statusEl.textContent=`Master: ${master.length} WBS`;
  renderMaster();
}

function renderMaster(){
  document.getElementById("count").textContent=`${master.length} WBS loaded`;
  const p=document.getElementById("preview");
  p.innerHTML="";
  if(!master.length)return;
  const t=document.createElement("table");
  t.innerHTML="<tr><th>WBS</th><th>Description</th><th>Project</th></tr>";
  master.slice(0,12).forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${r.wbs}</td><td>${r.description||""}</td><td>${r.project||""}</td>`;
    t.appendChild(tr);
  });
  p.appendChild(t);
}
renderMaster();
</script>
</body>
</html>
